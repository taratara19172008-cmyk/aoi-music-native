name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" || true
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version || true
      - name: Build app (unsigned)
        run: |
          xcodebuild -project AoiMusic.xcodeproj -scheme AoiMusic -configuration Release -sdk iphoneos \
            -derivedDataPath build/DD CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package IPA
        run: |
          APP=$(find build/DD/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "APP=$APP"
          test -n "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry AoiMusic-Native.ipa Payload
          ls -la AoiMusic-Native.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: AoiMusic-Native-ipa
          path: AoiMusic-Native.ipa
