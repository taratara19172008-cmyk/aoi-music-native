<title>AoiEngine</title>
<script>
window.AOI_CONFIG = { developerToken: "eyJ0eXAiOiJKV1QiLCJhbGciOiJFUzI1NiIsImtpZCI6IldlYlBsYXlLaWQifQ.eyJpc3MiOiJBTVBXZWJQbGF5IiwiaWF0IjoxNzkzOTAwNzA4LCJleHAiOjE3OTk5NDg3MDgsInJvb3RfaHR0cHNfb3JpZ2luIjpbImFwcGxlLmNvbSJdfQ.7L-PYJHjO8PpFdhKS-OSkf_snyFvg5cq-JDERUs_N_UcUX9Vk0kf1WLatgDeEvhB_Arg1b5Tl-99G1v6hUwH0A", relayBase: "https://aoi-relay.vercel.app/api/relay" };
</script>
<script>window.__mkScript = 'pending';</script>
<script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js" async onload="window.__mkScript='loaded'" onerror="window.__mkScript='error'"></script>
</head>
<body>
<script>
'use strict';
window.ENGINE_VERSION = '109.5';
function post(o) { try { window.webkit.messageHandlers.aoi.postMessage(o); } catch (e) {} }
post({ type: 'boot' });
const swReady = Promise.resolve();
let music = null;

// ---------- v109.3: relay layer (the web app's fast path, no SW) ----------
// The web app in Safari is instant on this same phone; the bundled
// engine crawls and degrades (setQueue settle 9-55s, worsening per
// track). Their playback code is the same shape - what differs is the
// network path: the web app's service worker reroutes every
// *.music.apple.com request (MusicKit's own included) through the
// relay, while this engine called Apple direct. A service worker can
// never control a WKWebView page (verified on device in the v110
// experiments: swctl=false), so do the SW's job at the fetch/XHR
// layer instead - the v110.5 tap proved MusicKit's catalog calls go
// through window.fetch and come back fast via the relay. Rules mirror
// sw.js exactly: *.music.apple.com only, js-cdn excluded (public
// static file), never rewrite a URL already aimed at the relay.
(function installRelay() {
  const relayBase = (window.AOI_CONFIG && window.AOI_CONFIG.relayBase) || '';
  if (!relayBase) return;
  const hostRe = /(^|\.)music\.apple\.com$/;
  function relayURL(raw) {
    try {
      const u = new URL(raw, location.href);
      if (!hostRe.test(u.hostname)) return null;
      if (u.hostname === 'js-cdn.music.apple.com') return null;
      if (String(raw).indexOf(relayBase) === 0) return null;
      return relayBase + '?target=' + encodeURIComponent(u.href);
    } catch (e) { return null; }
  }
  if (typeof window.fetch === 'function') {
    const origFetch = window.fetch.bind(window);
    window.fetch = function (input, init) {
      try {
        const raw = (typeof input === 'string') ? input : ((input && input.url) || '');
        const target = raw ? relayURL(raw) : null;
        if (target) {
          if (typeof input === 'string' || !input) return origFetch(target, init);
          const ni = { method: input.method, headers: input.headers, redirect: 'follow' };
          if (input.method !== 'GET' && input.method !== 'HEAD') {
            return input.clone().arrayBuffer().then(body => { ni.body = body; return origFetch(target, ni); });
          }
          return origFetch(target, ni);
        }
      } catch (e) {}
      return origFetch(input, init);
    };
  }
  if (window.XMLHttpRequest && XMLHttpRequest.prototype && XMLHttpRequest.prototype.open) {
    const origOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function () {
      try { const t = relayURL(arguments[1]); if (t) arguments[1] = t; } catch (e) {}
      return origOpen.apply(this, arguments);
    };
  }
  post({ type: 'log', message: 'relay layer on' });
})();
// ---------- playback core (v108: the web app's proven shape) ----------
// v105-v107 wrapped MusicKit in an adversarial control system: per-call
// timeouts, target verification with forced re-jumps, a stall watchdog,
// plus a second re-issue watchdog on the Swift side. On a real network
// those mechanisms fought MusicKit's own loading - a slow stream start
// tripped the 2.6s verifier, which restarted the load with a forced
// jump and posted a failure error, while the Swift side re-sent the
// whole queue at 6s. Switches collapsed; the first play (nothing to
// fight) worked. The web app's engine - the one that played and
// switched fine on this same phone - simply serializes every op and
// trusts each call: setQueue -> jump only when startIndex > 0 -> play,
// no timeouts, no verification, no retries. This core mirrors it.
// app modes: 0 off, 1 all, 2 one -> MusicKit: 0 off, 1 one, 2 all
const mkRepeat = m => m === 1 ? 2 : m === 2 ? 1 : 0;
let appRepeat = 0, appShuffle = false;

let opChain = Promise.resolve();
let queueReqToken = 0;
function op(fn) {
  const run = async () => { return await fn(); };
  const p = opChain.then(run, run);
  opChain = p.catch(() => {});
  return p;
}
function isAbort(e) { const m = String((e && e.message) || e); return (e && e.name === 'AbortError') || /abort/i.test(m); }
function reportErr(where, e) { if (isAbort(e)) return; post({ type: 'error', where, message: String((e && e.message) || e) }); }

function itemJSON() {
  const it = music && music.nowPlayingItem;
  if (!it) return null;
  const a = it.attributes || {};
  return {
    id: it.id || a.id || '',
    title: it.title || a.name || '',
    artist: it.artistName || a.artistName || '',
    album: it.albumName || a.albumName || '',
    artwork: (it.artwork && it.artwork.url) || it.artworkURL || (a.artwork && a.artwork.url) || '',
    duration: (typeof it.playbackDuration === 'number' ? it.playbackDuration : (a.durationInMillis ? a.durationInMillis / 1000 : 0)) || music.currentPlaybackDuration || 0
  };
}
function sendState() {
  if (!music) return;
  post({ type: 'state', isPlaying: !!music.isPlaying, state: music.playbackState });
}
function sendAuth() {
  if (!music) return;
  post({ type: 'auth', authorized: !!music.isAuthorized, storefront: music.storefrontId || '', token: music.musicUserToken || '' });
}
setInterval(() => {
  if (!music) return;
  assertMediaSession();
  post({ type: 'progress', t: music.currentPlaybackTime || 0, d: music.currentPlaybackDuration || 0, isPlaying: !!music.isPlaying });
}, 500);

// ---------- lock screen / control centre buttons (v107) ----------
// iOS picks the remote buttons from the handlers the page registers:
// the web defaults surface ±10s seek buttons, while the official app
// shows previous/next track. Registering track handlers (and clearing
// the seek ones) makes the system offer track changes, like the
// original. Re-asserted on the progress tick in case MusicKit rewrites
// the handlers when a new item loads.
function assertMediaSession() {
  try {
    if (!music || !('mediaSession' in navigator)) return;
    const ms = navigator.mediaSession;
    ms.setActionHandler('previoustrack', () => { window.AoiEngine.prev(); });
    ms.setActionHandler('nexttrack', () => { window.AoiEngine.next(); });
    ms.setActionHandler('seekforward', null);
    ms.setActionHandler('seekbackward', null);
    ms.setActionHandler('seekto', d => { if (d && typeof d.seekTime === 'number') window.AoiEngine.seek(d.seekTime); });
    ms.setActionHandler('play', () => { window.AoiEngine.play(); });
    ms.setActionHandler('pause', () => { window.AoiEngine.pause(); });
  } catch (e) {}
}

let mkInitStarted = false;
async function initMK() {
  if (mkInitStarted || !window.MusicKit) return;
  mkInitStarted = true;
  post({ type: 'log', message: 'configure start' });
  try {
    await MusicKit.configure({ developerToken: window.AOI_CONFIG.developerToken, app: { name: 'AoiMusic', build: '2.0.0' } });
    music = MusicKit.getInstance();
    window.__aoiHasMusic = true;
    music.addEventListener('playbackStateDidChange', sendState);
    music.addEventListener('nowPlayingItemDidChange', () => { post({ type: 'item', item: itemJSON() }); sendState(); });
    await swReady;
    post({ type: 'ready' });
    sendAuth();
  } catch (e) { post({ type: 'error', where: 'configure', message: String((e && e.message) || e) }); }
}
document.addEventListener('musickitloaded', initMK);
// the async script can execute before the listener above attaches (fast cache) — poll for the global as a fallback
let lastMkFlag = 'pending';
const mkPoll = setInterval(() => {
  if (window.__mkScript !== lastMkFlag) { lastMkFlag = window.__mkScript; post({ type: 'log', message: 'script=' + lastMkFlag }); }
  if (music) { clearInterval(mkPoll); return; }
  if (window.MusicKit) initMK();
}, 500);

setTimeout(() => { if (!music) post({ type: 'error', where: 'musickit', message: 'load timeout, script=' + window.__mkScript + ', global=' + (typeof window.MusicKit) }); }, 10000);

function loadedQueueIds() {
  try {
    const items = (music && music.queue && music.queue.items) || [];
    const out = [];
    for (let i = 0; i < items.length; i++) out.push(String((items[i] && items[i].id) || ''));
    return out;
  } catch (e) { return []; }
}
function parseUnresolved(e) {
  const m = /could not be resolved:?\s*([0-9]+(?:\s*,\s*[0-9]+)*)/i.exec(String((e && e.message) || e));
  if (!m) return [];
  return m[1].split(',').map(s => s.trim()).filter(Boolean);
}

function queuePosition() {
  try {
    const p = music && music.queue && music.queue.position;
    return (typeof p === 'number' && isFinite(p)) ? p : -1;
  } catch (e) { return -1; }
}
// Is the player verifiably sitting on index i of id list `ids`?
// true/false when MusicKit can tell us, null when it cannot.
function atTarget(i, ids) {
  const pos = queuePosition();
  if (pos >= 0) return pos === i;
  try {
    const it = music && music.nowPlayingItem;
    const curId = it ? String(it.id || '') : '';
    const want = (ids && ids[i] != null) ? String(ids[i]) : '';
    if (curId && want) return curId === want;
  } catch (e) {}
  return null;
}

// ---------- v109.5: bounded waits (anti-wedge) ----------
// On device (2026-11-17 17:27/17:29 diagnostics) a track SWITCH can
// leave changeToMediaAtIndex pending forever: the serial op chain
// then blocks every later command and the whole session goes silent
// - "the first song plays, switching kills it". v105-v107's sin was
// SHORT timeouts that force-restarted loads still in progress; these
// waits are the opposite: generous (10s, several times the slowest
// observed settle), they never re-issue or interrupt a call, they
// only stop WAITING on it so the chain survives. The underlying
// MusicKit call continues in the background and its state events
// still reach the UI.
function jumpTimeoutMs() { return window.__aoiJumpTimeoutMs || 10000; }
function playTimeoutMs() { return window.__aoiPlayTimeoutMs || 10000; }
// Resolves { ok:true } when the promise settles, { ok:false, timeout:
// true } after ms, { ok:false, error } on rejection. Never rejects.
function bounded(promise, ms) {
  return new Promise(resolve => {
    let done = false;
    const t = setTimeout(() => { if (!done) { done = true; resolve({ ok: false, timeout: true }); } }, ms);
    Promise.resolve(promise).then(
      () => { if (!done) { done = true; clearTimeout(t); resolve({ ok: true }); } },
      e => { if (!done) { done = true; clearTimeout(t); resolve({ ok: false, error: e }); } }
    );
  });
}
// One changeToMediaAtIndex with a bounded wait and a timing log.
// Returns 'ok' | 'error' | 'timeout'.
async function tryJump(i, label) {
  const t = Date.now();
  const r = await bounded(music.changeToMediaAtIndex(i), jumpTimeoutMs());
  const ms = Date.now() - t;
  if (r.ok) { post({ type: 'log', message: label + ' settled in ' + ms + 'ms' }); return 'ok'; }
  if (r.timeout) { post({ type: 'log', message: label + ' TIMED OUT after ' + ms + 'ms (call left running, no longer blocking)' }); return 'timeout'; }
  post({ type: 'log', message: label + ' failed: ' + String((r.error && r.error.message) || r.error) });
  return 'error';
}
// After a recovery rotation the engine's queue is the app list rotated
// by this many positions; jumpTo indices from the app are compensated.
let queueOffset = 0;

window.AoiEngine = {
  async authorize() {
    if (!music) { post({ type: 'error', where: 'authorize', message: 'engine not ready' }); return; }
    post({ type: 'log', message: 'origin: ' + location.origin });
    try { await music.authorize(); } catch (e) { post({ type: 'error', where: 'authorize', message: String((e && e.message) || e) }); }
    sendAuth();
  },
  async unauthorize() {
    if (!music) return;
    try { await music.unauthorize(); } catch (e) {}
    sendAuth();
  },
  playQueue(ids, startIndex, shuffle, repeat) {
    if (!music || !ids || !ids.length) return;
    // Modes are captured at CALL time: the op may run later, and a newer
    // call's settings must not leak into an older queued operation.
    const sh = !!shuffle, rp = repeat | 0, start = startIndex | 0;
    const token = ++queueReqToken;
    return op(async () => {
      // Coalescing: if a NEWER playQueue was requested while this one
      // waited its turn, skip it - only the latest queue matters.
      if (token !== queueReqToken) { post({ type: 'log', message: 'playQueue superseded, skipped' }); return; }
      const t0 = Date.now();
      appShuffle = sh; appRepeat = rp;
      const targetId = String(ids[start]);
      // v109 jump-first: if the requested list IS the queue MusicKit
      // already holds (same ids, same order) and shuffle is off, jump
      // inside it instead of paying a full setQueue reload.
      let jumped = false;
      if (!sh) {
        const cur = loadedQueueIds();
        if (cur.length === ids.length && cur.every((v, i) => v === String(ids[i]))) {
          let jumpErr = null, jumpTimedOut = false;
          for (let j = 0; j < 2 && !jumped; j++) {
            const r = await tryJump(start, 'jump to ' + start);
            if (r === 'ok') jumped = true;
            else if (r === 'timeout') { jumpTimedOut = true; break; }
            else jumpErr = true;
          }
          // v109.2: an ABORTED jump must not escalate into a full
          // setQueue reload (one interrupted jump became an 81s
          // reload on device). If the queue is still exactly this
          // list, excuse the abort - but v109.5: a TIMEOUT is not an
          // abort; the jump may simply never land, so reload.
          if (!jumped && jumpErr && !jumpTimedOut) {
            const cur2 = loadedQueueIds();
            if (cur2.length === ids.length && cur2.every((v, i) => v === String(ids[i]))) {
              jumped = true;
              post({ type: 'log', message: 'jump aborted, queue intact - skipping reload' });
            }
          }
          if (jumped) {
            // v109.4: a jump that verifiably did NOT land on the
            // target is not a jump at all. Reload instead.
            if (atTarget(start, ids) === false) {
              jumped = false;
              post({ type: 'log', message: 'jump did not land on target (position ' + queuePosition() + ' != ' + start + '), reloading' });
            } else {
              queueOffset = 0;
              post({ type: 'log', message: 'playQueue: same queue, jump to ' + start + ' done' });
            }
          }
          if (!jumped && jumpErr) {
            post({ type: 'log', message: 'same-queue jump failed, reloading' });
          }
        }
      }
      let playIndex = start;
      let attemptIds = ids.slice();
      if (!jumped) {
        // v109.4: when the target is the head of the queue, let
        // setQueue start playback itself (startPlaying) instead of a
        // separate play() round. Only at index 0: starting playback
        // at the head and THEN jumping would briefly play wrong.
        const useStartPlaying = playIndex === 0;
        post({ type: 'log', message: 'playQueue start (' + ids.length + ' songs @' + start + (useStartPlaying ? ', startPlaying' : '') + ')' });
        const tQ = Date.now();
        // v109.1 drop-and-retry: MusicKit rejects the WHOLE setQueue
        // when even one id cannot be resolved in this storefront.
        // Drop the named ids and retry - UNLESS the dropped id is
        // the song she actually tapped (v109.4): then stop and say
        // so, never substitute a neighbour silently.
        for (let attempt = 0; ; attempt++) {
          try {
            const desc = { songs: attemptIds, startIndex: playIndex };
            if (useStartPlaying) desc.startPlaying = true;
            await music.setQueue(desc);
            break;
          } catch (e) {
            const bad = parseUnresolved(e);
            if (!bad.length || attempt >= 3) throw e;
            if (bad.indexOf(targetId) >= 0) {
              post({ type: 'log', message: 'playQueue: target song ' + targetId + ' unavailable in this storefront, not playing a substitute' });
              post({ type: 'error', where: 'playQueue', message: 'target unavailable: ' + targetId });
              return;
            }
            let removedBefore = 0;
            const kept = [];
            for (let i = 0; i < attemptIds.length; i++) {
              if (bad.indexOf(String(attemptIds[i])) >= 0) { if (i < playIndex) removedBefore++; }
              else kept.push(attemptIds[i]);
            }
            if (kept.length === attemptIds.length || !kept.length) throw e;
            post({ type: 'log', message: 'playQueue: dropped unresolvable ' + bad.join(', ') + ', retrying with ' + kept.length });
            attemptIds = kept;
            playIndex = Math.max(0, playIndex - removedBefore);
            if (playIndex >= attemptIds.length) playIndex = attemptIds.length - 1;
          }
        }
        queueOffset = 0;
        post({ type: 'log', message: 'setQueue settled in ' + (Date.now() - tQ) + 'ms' });
      }
      // Apply the CAPTURED modes, not the globals.
      music.shuffleMode = sh ? 1 : 0;
      music.repeatMode = mkRepeat(rp);
      if (!jumped && playIndex > 0) {
        // Reach the target BEFORE playing, verified (v109.4) and
        // bounded (v109.5): retry the jump once; if it will not land
        // - error, timeout, or verifiably elsewhere - recover by
        // rebuilding the queue rotated so the target sits at the
        // head and starts there. The head-start is the one path that
        // has worked in every on-device session.
        let ok = false;
        for (let j = 0; j < 2 && !ok; j++) {
          const r = await tryJump(playIndex, 'jump after setQueue to ' + playIndex);
          if (r === 'ok') ok = true;
        }
        if (!sh) {
          const at = atTarget(playIndex, attemptIds);
          if (at === true) ok = true;
          if (at === false) ok = false;
        }
        if (!ok) {
          if (sh) {
            post({ type: 'log', message: 'target index ' + playIndex + ' not reached under shuffle - refusing to play the wrong song' });
            post({ type: 'error', where: 'playQueue', message: 'target index not reached' });
            return;
          }
          const rotated = attemptIds.slice(playIndex).concat(attemptIds.slice(0, playIndex));
          post({ type: 'log', message: 'jump would not land - recovering with rotated queue (target at head, offset ' + playIndex + ')' });
          try {
            await music.setQueue({ songs: rotated, startIndex: 0, startPlaying: true });
            queueOffset = playIndex;
          } catch (e) {
            post({ type: 'log', message: 'rotation recovery failed: ' + String((e && e.message) || e) });
            post({ type: 'error', where: 'playQueue', message: 'target index not reached' });
            return;
          }
        }
      }
      const tPlay = Date.now();
      const pr = await bounded(music.play(), playTimeoutMs());
      if (pr.timeout) post({ type: 'log', message: 'play TIMED OUT after ' + (Date.now() - tPlay) + 'ms (left running, chain unwedged)' });
      else if (!pr.ok) post({ type: 'log', message: 'play failed: ' + String((pr.error && pr.error.message) || pr.error) });
      else post({ type: 'log', message: 'play settled in ' + (Date.now() - tPlay) + 'ms' });
      post({ type: 'log', message: 'playQueue settled in ' + (Date.now() - t0) + 'ms' });
    }).catch(e => reportErr('playQueue', e));
  },
  playStation(id) {
    if (!music || !id) return;
    // A station request is the newer intent: it invalidates any WAITING
    // playQueue (a running one still finishes first, then this runs).
    queueReqToken++;
    return op(async () => { await music.setQueue({ station: id }); await music.play(); })
      .catch(e => reportErr('station', e));
  },
  play() { if (music) return op(() => bounded(music.play(), playTimeoutMs())).catch(() => {}); },
  pause() { if (music) return op(() => bounded(music.pause(), playTimeoutMs())).catch(() => {}); },
  next() { if (music) return op(() => bounded(music.skipToNextItem(), playTimeoutMs())).catch(() => {}); },
  prev() { if (music) return op(() => bounded(music.skipToPreviousItem(), playTimeoutMs())).catch(() => {}); },
  jumpTo(i) {
    if (!music) return;
    return op(async () => {
      // Compensate a recovery rotation: the app speaks in its own
      // list indices, the engine queue may be rotated by queueOffset.
      const len = loadedQueueIds().length;
      const idx = len > 0 ? (((i | 0) - queueOffset) % len + len) % len : (i | 0);
      await tryJump(idx, 'jumpTo ' + (i | 0));
    }).catch(() => {});
  },
  seek(sec) { if (music) { try { music.seekToTime(Number(sec) || 0); } catch (e) {} } },
  setShuffle(b) { appShuffle = !!b; if (music) music.shuffleMode = appShuffle ? 1 : 0; },
  setRepeat(m) { appRepeat = m | 0; if (music) music.repeatMode = mkRepeat(appRepeat); },
  state() { sendState(); const it = itemJSON(); if (it) post({ type: 'item', item: it }); }
};
</script>
</body>
