        // with no known queue there is nothing safe to jump in, so
        // report and stop instead of gambling on a hang.
        post({ type: 'log', message: 'jumpTo: no known queue, refusing (changeToMediaAtIndex is banned)' });
        post({ type: 'error', where: 'jumpTo', message: 'no queue context for jump' });
        return;
      }
      if (music.nowPlayingItem && String(music.nowPlayingItem.id) === targetId) {
        wantPlay = true; playWatch.itemId = null;
        await bounded(music.play(), playTimeoutMs());
        return;
      }
      const pos = cur.indexOf(targetId);
      if (pos < 0) {
        // Not loaded yet (background completion still landing):
        // rotate from the app list instead of dead-ending.
        post({ type: 'log', message: 'jumpTo: target ' + targetId + ' not loaded yet, rotating from app list' });
        await startFromAppList(targetId);
        return;
      }
      const rotated = cur.slice(pos).concat(cur.slice(0, pos));
      // v109.9: same two-phase start as playQueue; bumping the
      // generation also retires any background completion still
      // running for the previous queue.
      const gen = ++queueReqToken;
      let okJump = false;
      try { okJump = await startRotated(rotated, targetId, gen); }
      catch (e) {
        post({ type: 'log', message: 'jumpTo rotation failed: ' + String((e && e.message) || e) });
        return;
      }
      if (okJump) {
        queueOffset = i | 0;
        post({ type: 'log', message: 'jumpTo ' + (i | 0) + ': rotated queue, target at head' });
      }
    }).catch(() => {});
  },
  seek(sec) { if (music) { try { music.seekToTime(Number(sec) || 0); } catch (e) {} } },
  setShuffle(b) { appShuffle = !!b; if (music) music.shuffleMode = appShuffle ? 1 : 0; },
  setRepeat(m) { appRepeat = m | 0; if (music) music.repeatMode = mkRepeat(appRepeat); },
  state() { sendState(); const it = itemJSON(); if (it) post({ type: 'item', item: it }); },
  setRelay(on) { if (window.__aoiSetRelay) window.__aoiSetRelay(on); }
};
</script>
</body>
