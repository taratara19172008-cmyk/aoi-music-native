<title>AoiEngine</title>
<script>
window.AOI_CONFIG = { developerToken: "eyJ0eXAiOiJKV1QiLCJhbGciOiJFUzI1NiIsImtpZCI6IldlYlBsYXlLaWQifQ.eyJpc3MiOiJBTVBXZWJQbGF5IiwiaWF0IjoxNzkzOTAwNzA4LCJleHAiOjE3OTk5NDg3MDgsInJvb3RfaHR0cHNfb3JpZ2luIjpbImFwcGxlLmNvbSJdfQ.7L-PYJHjO8PpFdhKS-OSkf_snyFvg5cq-JDERUs_N_UcUX9Vk0kf1WLatgDeEvhB_Arg1b5Tl-99G1v6hUwH0A", relayBase: "https://aoi-relay.vercel.app/api/relay" };
</script>
<script>window.__mkScript = 'pending';</script>
<script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js" async onload="window.__mkScript='loaded'" onerror="window.__mkScript='error'"></script>
</head>
<body>
<script>
'use strict';
function post(o) { try { window.webkit.messageHandlers.aoi.postMessage(o); } catch (e) {} }
post({ type: 'boot' });
const swReady = Promise.resolve();
let music = null;
// ---------- playback core (v105: intent-based, latest tap wins, nothing can wedge) ----------
// The old design serialized every operation onto one promise chain: a single
// MusicKit promise that never settles (setQueue/play are known to hang on a
// stalled stream) blocked every later tap forever — songs would not start and
// track switches silently never happened. Now every play request is an
// "intent" with a sequence number; a single runner works on the NEWEST intent
// only, every MusicKit await has a timeout, and after starting, the runner
// verifies the target item actually plays and retries once if it does not.
// app modes: 0 off, 1 all, 2 one -> MusicKit: 0 off, 1 one, 2 all
const mkRepeat = m => m === 1 ? 2 : m === 2 ? 1 : 0;
let appRepeat = 0, appShuffle = false;

let intentSeq = 0;
let pendingIntent = null;
let runnerActive = false;
let wantPlaying = false;
let lastAdvanceAt = Date.now();
let lastTime = -1;
let stallRescues = 0;

function isAbort(e) { const m = String((e && e.message) || e); return (e && e.name === 'AbortError') || /abort/i.test(m); }
function reportErr(where, e) { if (isAbort(e)) return; post({ type: 'error', where, message: String((e && e.message) || e) }); }
function withTimeout(p, ms, label) {
  return Promise.race([
    Promise.resolve(p),
    new Promise((_, rej) => setTimeout(() => rej(new Error('timeout:' + label)), ms))
  ]);
}
function callMK(fn, ms, label) {
  let p;
  try { p = fn(); } catch (e) { return Promise.reject(e); }
  return withTimeout(p, ms, label);
}

async function waitForTarget(targetId, ms) {
  const t0 = Date.now();
  while (Date.now() - t0 < ms) {
    const it = music.nowPlayingItem;
    if (it && (!targetId || it.id === targetId) && (music.isPlaying || music.playbackState === 2)) return true;
    await new Promise(r => setTimeout(r, 200));
  }
  const it = music.nowPlayingItem;
  return !!(it && (!targetId || it.id === targetId));
}

function queueIds() {
  try { return (music.queue.items || []).map(it => it.id); } catch (e) { return []; }
}

async function startPlayback(intent) {
  wantPlaying = true;
  const targetId = intent.stationId ? null : intent.ids[intent.startIndex];
  const aim = intent.actualIndex != null ? intent.actualIndex : intent.startIndex;
  for (let attempt = 0; attempt < 2; attempt++) {
    if (intent.seq !== intentSeq) return;
    try { await callMK(() => music.play(), 6000, 'play'); } catch (e) { /* verified below */ }
    if (intent.seq !== intentSeq) return;
    if (await waitForTarget(targetId, 2600)) return;
    if (intent.seq !== intentSeq) return;
    if (!intent.stationId && aim > 0) {
      try { await callMK(() => music.changeToMediaAtIndex(aim), 5000, 'changeItem'); } catch (e) {}
    }
  }
  if (intent.seq === intentSeq && targetId) {
    post({ type: 'error', where: 'playQueue', message: 'playback did not reach target item' });
  }
}

async function runIntent(intent) {
  const stale = () => intent.seq !== intentSeq;
  try {
    if (intent.stationId) {
      await callMK(() => music.setQueue({ station: intent.stationId }), 9000, 'setQueue');
    } else {
      await callMK(() => music.setQueue({ songs: intent.ids, startIndex: intent.startIndex }), 9000, 'setQueue');
      if (stale()) return;
      // MusicKit silently drops ids it cannot resolve, which shifts every
      // later position. Read the real queue back, tell the app what it
      // actually holds, and aim by the target's real position from here on.
      const qids = queueIds();
      if (qids.length) post({ type: 'queue', ids: qids });
      const actual = qids.indexOf(intent.ids[intent.startIndex]);
      intent.actualIndex = actual >= 0 ? actual : intent.startIndex;
    }
    if (stale()) return;
    music.shuffleMode = appShuffle ? 1 : 0;
    music.repeatMode = mkRepeat(appRepeat);
    const aim = intent.actualIndex != null ? intent.actualIndex : intent.startIndex;
    if (!intent.stationId && aim > 0) {
      try { await callMK(() => music.changeToMediaAtIndex(aim), 5000, 'changeItem'); } catch (e) {}
    }
    if (stale()) return;
    await startPlayback(intent);
  } catch (e) {
    if (!stale()) reportErr(intent.stationId ? 'station' : 'playQueue', e);
  }
}

function kickRunner() {
  if (runnerActive) return;
  runnerActive = true;
  (async () => {
    try {
      while (pendingIntent) {
        const intent = pendingIntent;
        pendingIntent = null;
        await runIntent(intent);
      }
    } finally { runnerActive = false; }
  })();
}

function requestPlay(ids, startIndex, stationId) {
  intentSeq++;
  pendingIntent = { seq: intentSeq, ids: ids || null, startIndex: startIndex | 0, stationId: stationId || null };
  kickRunner();
}

// stall watchdog: supposed to be playing but the stream sits in a
// loading/waiting/stalled state with no time progress — nudge play() again.
setInterval(() => {
  if (!music) return;
  const t = music.currentPlaybackTime || 0;
  if (music.isPlaying && Math.abs(t - lastTime) > 0.01) {
    lastTime = t; lastAdvanceAt = Date.now(); stallRescues = 0; return;
  }
  const st = music.playbackState;
  if (wantPlaying && !music.isPlaying && (st === 1 || st === 7 || st === 8) &&
      Date.now() - lastAdvanceAt > 7000 && stallRescues < 2) {
    stallRescues++;
    lastAdvanceAt = Date.now();
    callMK(() => music.play(), 6000, 'play').catch(() => {});
  }
}, 1000);

function itemJSON() {
  const it = music && music.nowPlayingItem;
  if (!it) return null;
  const a = it.attributes || {};
  return {
    id: it.id || a.id || '',
    title: it.title || a.name || '',
    artist: it.artistName || a.artistName || '',
    album: it.albumName || a.albumName || '',
    artwork: (it.artwork && it.artwork.url) || it.artworkURL || (a.artwork && a.artwork.url) || '',
    duration: (typeof it.playbackDuration === 'number' ? it.playbackDuration : (a.durationInMillis ? a.durationInMillis / 1000 : 0)) || music.currentPlaybackDuration || 0
  };
}
function sendState() {
  if (!music) return;
  post({ type: 'state', isPlaying: !!music.isPlaying, state: music.playbackState });
}
function sendAuth() {
  if (!music) return;
  post({ type: 'auth', authorized: !!music.isAuthorized, storefront: music.storefrontId || '', token: music.musicUserToken || '' });
}
setInterval(() => {
  if (!music) return;
  post({ type: 'progress', t: music.currentPlaybackTime || 0, d: music.currentPlaybackDuration || 0, isPlaying: !!music.isPlaying });
}, 500);

let mkInitStarted = false;
async function initMK() {
  if (mkInitStarted || !window.MusicKit) return;
  mkInitStarted = true;
  post({ type: 'log', message: 'configure start' });
  try {
    await MusicKit.configure({ developerToken: window.AOI_CONFIG.developerToken, app: { name: 'AoiMusic', build: '2.0.0' } });
    music = MusicKit.getInstance();
    window.__aoiHasMusic = true;
    music.addEventListener('playbackStateDidChange', sendState);
    music.addEventListener('nowPlayingItemDidChange', () => { lastAdvanceAt = Date.now(); stallRescues = 0; post({ type: 'item', item: itemJSON() }); sendState(); });
    await swReady;
    post({ type: 'ready' });
    sendAuth();
  } catch (e) { post({ type: 'error', where: 'configure', message: String((e && e.message) || e) }); }
}
document.addEventListener('musickitloaded', initMK);
// the async script can execute before the listener above attaches (fast cache) — poll for the global as a fallback
let lastMkFlag = 'pending';
const mkPoll = setInterval(() => {
  if (window.__mkScript !== lastMkFlag) { lastMkFlag = window.__mkScript; post({ type: 'log', message: 'script=' + lastMkFlag }); }
  if (music) { clearInterval(mkPoll); return; }
  if (window.MusicKit) initMK();
}, 500);

setTimeout(() => { if (!music) post({ type: 'error', where: 'musickit', message: 'load timeout, script=' + window.__mkScript + ', global=' + (typeof window.MusicKit) }); }, 10000);

window.AoiEngine = {
  async authorize() {
    if (!music) { post({ type: 'error', where: 'authorize', message: 'engine not ready' }); return; }
    post({ type: 'log', message: 'origin: ' + location.origin });
    try { await music.authorize(); } catch (e) { post({ type: 'error', where: 'authorize', message: String((e && e.message) || e) }); }
    sendAuth();
  },
  async unauthorize() {
    if (!music) return;
    try { await music.unauthorize(); } catch (e) {}
    sendAuth();
  },
  playQueue(ids, startIndex, shuffle, repeat) {
    if (!music || !ids || !ids.length) return;
    appShuffle = !!shuffle; appRepeat = repeat | 0;
    requestPlay(ids, startIndex | 0, null);
  },
  playStation(id) {
    if (!music || !id) return;
    requestPlay(null, 0, id);
  },
  play() { wantPlaying = true; if (music) callMK(() => music.play(), 6000, 'play').catch(e => reportErr('play', e)); },
  pause() { wantPlaying = false; if (music) { try { const p = music.pause(); if (p && p.catch) p.catch(() => {}); } catch (e) {} } },
  next() { if (music) callMK(() => music.skipToNextItem(), 5000, 'next').catch(() => {}); },
  prev() { if (music) callMK(() => music.skipToPreviousItem(), 5000, 'prev').catch(() => {}); },
  jumpTo(i) {
    if (!music) return;
    callMK(() => music.changeToMediaAtIndex(i | 0), 5000, 'changeItem')
      .then(() => { if (wantPlaying && !music.isPlaying) return callMK(() => music.play(), 6000, 'play'); })
      .catch(() => {});
  },
  seek(sec) { if (music) { try { music.seekToTime(Number(sec) || 0); } catch (e) {} } },
  setShuffle(b) { appShuffle = !!b; if (music) music.shuffleMode = appShuffle ? 1 : 0; },
  setRepeat(m) { appRepeat = m | 0; if (music) music.repeatMode = mkRepeat(appRepeat); },
  state() { sendState(); const it = itemJSON(); if (it) post({ type: 'item', item: it }); }
};
</script>
</body>
</html>
